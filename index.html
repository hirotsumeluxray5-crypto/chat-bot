
<!DOCTYPE html>
<html lang="fr">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mon Chatbot</title>

    <link rel="stylesheet" href="css/peekobot.css">

    <style>
        :root {
            --peekobot-height: 70vh;
        }

        body {
            margin: 0;

            background: #f4f6f8;
            color: #222;

        header {
            padding: 25px;

            background: #263746;

        }

            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        h2 {
            text-align: center;
        }
    </style>
</head>

<body>

        <h1>Mon assistant</h1>

    </header>

    <main>

        <div id="peekobot-container">

                <div id="peekobot"></div>
            </div>
        </div>
    </main>

    <script src="js/conversation.js"></script>
    <script src="js/peekobot.js"></script>

</html>
